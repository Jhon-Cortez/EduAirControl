version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: eduaircontrol-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduaircontrol}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio (define Web/.env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio (define Web/.env)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
