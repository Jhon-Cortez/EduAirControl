services:
  backend:
    build: ./backend
    container_name: backend-app
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (min 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@eduaircontrol.com}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eduaircontrol}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      # Primer administrador (formato de companyCode obligatorio: AAA-0000)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eduaircontrol.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      ADMIN_COMPANY_CODE: ${ADMIN_COMPANY_CODE:-EDU-0001}
      # 'dev' siembra ambientes, sensores y un anio de mediciones; vacio = solo esquema
      DB_CHANGELOG_CONTEXTS: ${DB_CHANGELOG_CONTEXTS:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always

  # SMTP local para la recuperacion de contraseña (UI: http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always

  frontend:
    build:
      context: ./Front-End
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: frontend-app
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: always

  postgres:
    image: postgres:15
    container_name: eduaircontrol-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduaircontrol}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
  jenkins:
    build:
      context: ../jenkins
      dockerfile: dockerfile
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

volumes:
  postgres_data:
  jenkins_data:
