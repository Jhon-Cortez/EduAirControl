spring.application.name=backend
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/eduaircontrol}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Esquema gestionado por Liquibase (ddl deshabilitado).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# dev => seeds de desarrollo; vacio => solo esquema + seeds de referencia.
spring.liquibase.contexts=${DB_CHANGELOG_CONTEXTS:dev}

server.error.include-message=always

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Arranque del primer administrador (se omite si no esta definido).
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.company-code=${ADMIN_COMPANY_CODE:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:no-reply@eduaircontrol.com}

# --- Outbox transaccional hacia ms-environment-monitoring (ADR-007) ---
# Desactivar en tests de integracion del monolito: no hay broker ahi y la ingesta
# no debe depender de que exista RabbitMQ.
app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.exchange=${OUTBOX_EXCHANGE:eduaircontrol.environmental-data}
app.outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:1000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:100}
app.outbox.health-interval-ms=${OUTBOX_HEALTH_INTERVAL_MS:60000}
app.outbox.stale-minutes=${OUTBOX_STALE_MINUTES:5}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
